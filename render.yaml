# Mise en ligne sur Render (https://render.com) — offre gratuite.
#
# Render lit ce fichier a la racine du depot. Le service clone le depot
# entier : `rootDir: backend` ne limite que l'endroit d'ou les commandes
# sont lancees, pas ce qui est telecharge. C'est necessaire ici, car
# backend/app/config.py remonte de deux niveaux pour lire data/ et
# frontend/, qui sont a la racine.
#
# La base SQLite n'est pas versionnee (.gitignore) : elle est reconstruite
# a chaque construction par `python -m app.charger`, a partir des CSV du
# depot. C'est voulu — meme entree, meme base.
#
# Le disque d'une instance gratuite est EPHEMERE : tout ce qui est ecrit
# pendant l'execution disparait au redemarrage. Sans consequence ici,
# l'application ne faisant que lire.

services:
  - type: web
    name: edualert-bf
    runtime: python
    plan: free
    region: frankfurt          # le plus proche du Burkina Faso chez Render
    branch: main
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python -m app.charger"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /sante
    autoDeploy: true
    envVars:
      # Version figee : sans elle, Render choisit sa version par defaut, qui
      # peut changer sans prevenir et casser une mise en ligne qui marchait.
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Evite d'ecrire des .pyc sur un disque ephemere.
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      # Journaux affiches immediatement dans la console Render.
      - key: PYTHONUNBUFFERED
        value: "1"
